<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EduPocket – Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--sur:#fff;--bdr:#e2e6ea;--bdr2:#d0d5dd;
  --txt:#1a1d23;--txt2:#4b5563;--muted:#6b7280;
  --accent:#7c5cfc;--accent2:#43e89e;
  --red:#ef4444;--green:#10b981;--blue:#3b82f6;--yellow:#f59e0b;--orange:#f97316;
}
body{background:var(--bg);color:var(--txt);font-family:'Sora',sans-serif;min-height:100vh;padding-bottom:60px}

/* ── TOPBAR ── */
.topbar{background:#fff;border-bottom:1px solid var(--bdr);padding:0 16px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.back-btn{background:transparent;border:1.5px solid var(--bdr2);color:var(--txt2);padding:5px 12px;border-radius:8px;font-size:.78rem;font-family:'Sora',sans-serif;cursor:pointer;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.topbar-title{font-weight:700;font-size:.95rem;color:var(--accent)}
.ai-top-btn{margin-left:auto;background:linear-gradient(135deg,#7c5cfc,#43e89e);color:#fff;border:none;border-radius:9px;padding:7px 14px;font-size:.75rem;font-family:'Sora',sans-serif;font-weight:600;cursor:pointer;transition:all .2s}
.ai-top-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,92,252,.4)}

/* ── HOME: CATEGORY LIST ── */
#home-view{display:block}
.home-content{padding:14px 14px 0}
.search-wrap{margin-bottom:14px}
.search-wrap input{width:100%;padding:10px 14px;border:1.5px solid var(--bdr2);border-radius:10px;font-size:.84rem;font-family:'Sora',sans-serif;outline:none;background:#fff;color:var(--txt);transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:#9ca3af}

.cat-block{margin-bottom:18px}
.cat-label{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;margin-bottom:8px;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border:1.5px solid var(--bdr);border-radius:100px;padding:7px 14px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;color:var(--txt2)}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:0 2px 10px rgba(124,92,252,.12)}
.chip.selected{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── SUBJECT VIEW ── */
#subj-view{display:none}
.subj-topbar{background:#fff;border-bottom:1px solid var(--bdr);padding:0 14px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:54px;z-index:150;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.subj-back{background:transparent;border:1.5px solid var(--bdr2);color:var(--txt2);padding:5px 12px;border-radius:8px;font-size:.78rem;cursor:pointer;font-family:'Sora',sans-serif;transition:all .2s}
.subj-back:hover{border-color:var(--accent);color:var(--accent)}
.subj-name-bar{font-weight:700;font-size:.9rem;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.subj-content{padding:14px}
.subj-hdr{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;margin-bottom:14px}
.subj-ico{font-size:2rem}
.subj-title{font-size:1.05rem;font-weight:700}
.subj-cat{font-size:.72rem;color:var(--muted);margin-top:2px}

/* inner tabs */
.itabs{display:flex;gap:4px;background:#f0f2f5;border:1px solid var(--bdr);border-radius:10px;padding:4px;margin-bottom:14px}
.itab{flex:1;padding:7px 4px;border:none;background:transparent;color:var(--muted);font-family:'Sora',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;border-radius:7px;transition:all .2s;white-space:nowrap}
.itab.on{background:#fff;color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ipane{display:none}.ipane.on{display:block}

/* notes */
.note-chip{background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:13px;margin-bottom:9px}
.note-chip-t{font-size:.84rem;font-weight:700;color:var(--txt);margin-bottom:5px}
.note-chip-b{font-size:.76rem;color:var(--txt2);line-height:1.7;white-space:pre-wrap}

/* videos */
.vid-hint{font-size:.74rem;color:var(--muted);background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.vid-card{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:all .2s}
.vid-card:hover{border-color:#ef4444;transform:translateY(-2px);box-shadow:0 4px 14px rgba(239,68,68,.12)}
.vid-thumb{width:52px;height:37px;background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.05));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;border:1px solid rgba(239,68,68,.2)}
.vid-info{flex:1;min-width:0}
.vid-title{font-size:.82rem;font-weight:600;color:var(--txt);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid-meta{font-size:.68rem;color:var(--muted)}
.vid-badge{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2);padding:2px 7px;border-radius:5px;font-size:.6rem;font-weight:700;font-family:'Space Mono',monospace;flex-shrink:0}
.vid-arrow{color:#ef4444;font-size:.85rem;flex-shrink:0}

/* q&a */
.iq-item{background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:13px;margin-bottom:9px}
.iq-q{font-size:.83rem;font-weight:600;color:var(--txt);margin-bottom:7px;line-height:1.5}
.iq-num{display:inline-block;background:var(--accent);color:#fff;border-radius:5px;padding:1px 7px;font-size:.68rem;font-weight:700;margin-right:5px;font-family:'Space Mono',monospace}
.iq-btn{background:transparent;border:1.5px solid var(--bdr2);color:var(--accent);padding:4px 11px;border-radius:7px;font-size:.72rem;font-family:'Sora',sans-serif;cursor:pointer;transition:all .2s}
.iq-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.iq-ans{display:none;margin-top:9px;padding:9px 11px;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;font-size:.76rem;color:var(--txt2);line-height:1.7;white-space:pre-wrap}

/* my notes */
.notes-ed textarea{width:100%;min-height:120px;background:#fff;border:1.5px solid var(--bdr2);color:var(--txt);padding:9px 11px;border-radius:10px;font-size:.8rem;font-family:'Sora',sans-serif;resize:vertical;outline:none;transition:border-color .2s;line-height:1.7}
.notes-ed textarea:focus{border-color:var(--accent)}
.notes-ed textarea::placeholder{color:#9ca3af}
.note-title-inp{width:100%;padding:7px 11px;border:1.5px solid var(--bdr2);border-radius:8px;font-size:.8rem;font-family:'Sora',sans-serif;outline:none;background:#fff;color:var(--txt);margin-bottom:7px;transition:border-color .2s}
.note-title-inp:focus{border-color:var(--accent)}
.btn-save{background:var(--green);border:none;color:#fff;padding:8px 18px;border-radius:9px;font-size:.82rem;font-family:'Sora',sans-serif;font-weight:700;cursor:pointer;margin-top:7px;transition:all .2s}
.btn-save:hover{background:#059669}
.saved-note{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:11px;margin-bottom:7px}
.sn-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.sn-title{font-size:.78rem;font-weight:700;color:var(--txt)}
.sn-date{font-size:.63rem;color:var(--muted);font-family:'Space Mono',monospace}
.sn-body{font-size:.74rem;color:var(--txt2);line-height:1.6;white-space:pre-wrap}
.del-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.88rem;transition:color .2s}
.del-btn:hover{color:#ef4444}

/* empty */
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:.82rem}
.empty span{font-size:1.8rem;display:block;margin-bottom:7px}

/* AI CHATBOT */
#chat-fab{position:fixed;bottom:18px;right:16px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7c5cfc,#43e89e);border:none;color:#fff;font-size:1.25rem;cursor:pointer;box-shadow:0 4px 18px rgba(124,92,252,.45);z-index:300;display:flex;align-items:center;justify-content:center;transition:all .25s}
#chat-fab:hover{transform:scale(1.1)}
#chat-win{position:fixed;bottom:80px;right:16px;width:300px;max-height:440px;background:#fff;border:1.5px solid var(--bdr2);border-radius:18px;box-shadow:0 12px 48px rgba(0,0,0,.14);z-index:301;display:none;flex-direction:column;overflow:hidden}
#chat-win.open{display:flex}
.cw-hdr{background:linear-gradient(135deg,#7c5cfc,#5b3fe8);color:#fff;padding:11px 13px;display:flex;align-items:center;gap:9px}
.cw-av{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.cw-nm{font-size:.84rem;font-weight:700}.cw-st{font-size:.6rem;opacity:.85}
.cw-x{margin-left:auto;background:transparent;border:none;color:#fff;font-size:1rem;cursor:pointer;opacity:.8}
.cw-x:hover{opacity:1}
#cw-msgs{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
#cw-msgs::-webkit-scrollbar{width:2px}
#cw-msgs::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.cm{max-width:88%}.cm.bot{align-self:flex-start}.cm.usr{align-self:flex-end}
.cb{padding:7px 10px;border-radius:11px;font-size:.77rem;line-height:1.6}
.cm.bot .cb{background:#f0f2f5;border:1px solid var(--bdr);border-bottom-left-radius:3px;color:var(--txt)}
.cm.usr .cb{background:linear-gradient(135deg,#7c5cfc,#5b3fe8);color:#fff;border-bottom-right-radius:3px}
.ct{font-size:.56rem;color:var(--muted);margin-top:2px}.cm.usr .ct{text-align:right}
#cw-qr{padding:5px 8px;display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--bdr)}
.cqb{background:#f0f2f5;border:1px solid var(--bdr);color:var(--muted);padding:2px 7px;border-radius:100px;font-size:.62rem;cursor:pointer;transition:all .15s;font-family:'Space Mono',monospace}
.cqb:hover{border-color:var(--accent);color:var(--accent)}
#cw-ir{padding:7px 9px;border-top:1px solid var(--bdr);display:flex;gap:5px;align-items:center}
#cw-inp{flex:1;background:#f0f2f5;border:1.5px solid var(--bdr);color:var(--txt);padding:6px 9px;border-radius:7px;font-size:.75rem;font-family:'Sora',sans-serif;outline:none;transition:border-color .2s}
#cw-inp:focus{border-color:var(--accent)}
#cw-inp::placeholder{color:#9ca3af}
#cw-send{width:29px;height:29px;border-radius:7px;border:none;background:linear-gradient(135deg,#7c5cfc,#5b3fe8);color:#fff;font-size:.82rem;cursor:pointer;flex-shrink:0;transition:all .2s}
#cw-send:hover{transform:scale(1.08)}
.cdots{display:flex;gap:3px;align-items:center;padding:3px 0}
.cdots span{width:4px;height:4px;border-radius:50%;background:#9ca3af;animation:cd .8s ease infinite}
.cdots span:nth-child(2){animation-delay:.15s}.cdots span:nth-child(3){animation-delay:.3s}
@keyframes cd{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

/* TOAST */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;border-radius:9px;padding:7px 16px;font-size:.78rem;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  #chat-win{width:calc(100vw - 32px);right:16px}
}
</style>
</head>
<body>

<!-- MAIN TOPBAR -->
<div class="topbar">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <div class="topbar-title">🎓 EduPocket Classroom</div>
  <button class="ai-top-btn" onclick="openChat()">🤖 AI Chat</button>
</div>

<!-- HOME VIEW: ALL SUBJECTS -->
<div id="home-view">
  <div class="home-content">
    <div class="search-wrap">
      <input type="text" id="search-inp" placeholder="🔍 Search any subject…" oninput="filterSubjects(this.value)"/>
    </div>
    <div id="cat-list"></div>
  </div>
</div>

<!-- SUBJECT VIEW -->
<div id="subj-view">
  <div class="subj-topbar">
    <button class="subj-back" onclick="closeSubject()">← All Subjects</button>
    <div class="subj-name-bar" id="subj-name-bar"></div>
  </div>
  <div class="subj-content" id="subj-content"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- AI CHAT FAB -->
<button id="chat-fab" onclick="toggleChat()" title="AI Study Assistant">🤖</button>

<!-- AI CHAT WINDOW -->
<div id="chat-win">
  <div class="cw-hdr">
    <div class="cw-av">🤖</div>
    <div><div class="cw-nm">EduPocket AI</div><div class="cw-st">● Online · Study Assistant</div></div>
    <button class="cw-x" onclick="toggleChat()">✕</button>
  </div>
  <div id="cw-msgs"></div>
  <div id="cw-qr"></div>
  <div id="cw-ir">
    <input id="cw-inp" type="text" placeholder="Ask anything…" onkeydown="if(event.key==='Enter')cwSend()"/>
    <button id="cw-send" onclick="cwSend()">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  ALL SUBJECTS DATA
//  Categories match your screenshot exactly
// ══════════════════════════════════════════════════════
var CATEGORIES = [
  {
    label:'💻 CS / IT Core', color:'#3b82f6',
    subjects:[
      {
        id:'dsa', name:'Data Structures & Algorithms', icon:'🌲',
        desc:'Arrays · Linked Lists · Trees · Graphs · Sorting · Dynamic Programming',
        notes:[
          {title:'Big-O Time Complexity',body:'O(1) Constant: Array access, hash map get\nO(log n) Log: Binary search, balanced BST\nO(n) Linear: Linear search, single loop\nO(n log n) Log-Linear: Merge sort, heap sort\nO(n²) Quadratic: Bubble/Selection/Insertion sort\nO(2ⁿ) Exponential: Recursive Fibonacci\n\n📌 Always analyse worst-case unless told otherwise'},
          {title:'Sorting Algorithms',body:'Bubble Sort: compare adjacent, swap if wrong order — O(n²)\nSelection Sort: find min, place at front — O(n²)\nInsertion Sort: insert into sorted portion — O(n²), good for small/nearly-sorted\nMerge Sort: divide and conquer, stable — O(n log n)\nQuick Sort: pivot partition — O(n log n) avg, O(n²) worst\nHeap Sort: use max-heap — O(n log n), in-place\n\n📌 Best for large data: Merge Sort (stable) or Quick Sort (cache-friendly)'},
          {title:'Trees & Graphs',body:'Binary Search Tree (BST): left < root < right\n  Search/Insert/Delete: O(log n) average, O(n) worst\n\nBalanced BST (AVL/Red-Black): always O(log n)\n\nGraph representations:\n  Adjacency Matrix: O(V²) space, O(1) edge check\n  Adjacency List: O(V+E) space, better for sparse\n\nGraph traversal:\n  BFS: level-order, uses Queue — shortest path (unweighted)\n  DFS: depth-first, uses Stack/Recursion — detect cycles\n\nShortest Path:\n  Dijkstra: weighted, non-negative edges — O((V+E) log V)\n  Bellman-Ford: handles negative edges — O(VE)'}
        ],
        videos:[
          {title:'Data Structures Full Course',channel:'freeCodeCamp',duration:'8:02:23',url:'https://www.youtube.com/watch?v=RBSGKlAvoiM',tag:'Full Course'},
          {title:'Algorithms and Data Structures',channel:'freeCodeCamp',duration:'5:22:09',url:'https://www.youtube.com/watch?v=8hly31xKli0',tag:'Algorithms'},
          {title:'Dynamic Programming — Learn to Solve',channel:'freeCodeCamp',duration:'5:00:00',url:'https://www.youtube.com/watch?v=oBt53YbR9Kk',tag:'DP'},
          {title:'Big O Notation — Full Guide',channel:'Web Dev Simplified',duration:'18:47',url:'https://www.youtube.com/watch?v=itn09C2ZB9Y',tag:'Complexity'},
          {title:'Graph Algorithms for Technical Interviews',channel:'freeCodeCamp',duration:'2:13:42',url:'https://www.youtube.com/watch?v=tWVWeAqZ0WU',tag:'Graphs'},
          {title:'Sorting Algorithms Visualised',channel:'CS Dojo',duration:'23:41',url:'https://www.youtube.com/watch?v=kPRA0W1kECg',tag:'Sorting'}
        ],
        iqs:[
          {q:'What is the difference between BFS and DFS?',a:'BFS (Breadth-First Search):\n  Uses Queue (FIFO)\n  Explores level by level\n  Best for: shortest path (unweighted), level-order traversal\n  Time: O(V+E), Space: O(V)\n\nDFS (Depth-First Search):\n  Uses Stack/Recursion\n  Explores as deep as possible first\n  Best for: cycle detection, topological sort, connected components\n  Time: O(V+E), Space: O(V)'},
          {q:'Explain Dynamic Programming with an example.',a:'DP = break problem into overlapping subproblems, store results (memoisation/tabulation)\n\nExample — Fibonacci:\n  Naive recursion: O(2ⁿ)\n  DP with memo: O(n) — store computed results\n\nConditions for DP:\n  1. Optimal substructure: optimal solution built from optimal sub-solutions\n  2. Overlapping subproblems: same subproblems solved repeatedly\n\nCommon DP problems: Knapsack, LCS, LIS, Coin Change, Matrix Chain'}
        ]
      },
      {
        id:'oop', name:'Object-Oriented Programming', icon:'🧱',
        desc:'Classes · Inheritance · Polymorphism · Encapsulation · Abstraction',
        notes:[
          {title:'4 Pillars of OOP',body:'Encapsulation: Bundle data + methods, hide internal state\n  Access modifiers: private, protected, public\n\nAbstraction: Hide complexity, show only necessary interface\n  Abstract classes, interfaces\n\nInheritance: Child class inherits from parent\n  Code reuse, "is-a" relationship\n  Types: Single, Multiple (Python/C++), Multilevel, Hierarchical\n\nPolymorphism: Same interface, different behaviour\n  Compile-time: Method overloading (same name, diff params)\n  Run-time: Method overriding (child overrides parent)'},
          {title:'SOLID Principles',body:'S — Single Responsibility: Each class has one job\nO — Open/Closed: Open for extension, closed for modification\nL — Liskov Substitution: Subtypes must be substitutable for base types\nI — Interface Segregation: No client should depend on unused methods\nD — Dependency Inversion: Depend on abstractions, not concretions\n\n📌 SOLID = write code that is maintainable and scalable'}
        ],
        videos:[
          {title:'Object Oriented Programming — Full Course',channel:'freeCodeCamp',duration:'2:02:17',url:'https://www.youtube.com/watch?v=Ej_02ICOIgs',tag:'Full Course'},
          {title:'OOP in Python — Full Course',channel:'Tech With Tim',duration:'1:48:00',url:'https://www.youtube.com/watch?v=JeznW_7DlB0',tag:'Python'},
          {title:'SOLID Principles Explained',channel:'Web Dev Simplified',duration:'21:22',url:'https://www.youtube.com/watch?v=UQqY3_6Epbg',tag:'SOLID'},
          {title:'Design Patterns — Full Course',channel:'freeCodeCamp',duration:'1:01:51',url:'https://www.youtube.com/watch?v=tv-_1er1mWI',tag:'Patterns'}
        ],
        iqs:[
          {q:'What is polymorphism? Explain with an example.',a:'Polymorphism = same interface, different behaviour\n\nCompile-time (Method Overloading):\n  Same method name, different parameters\n  Resolved at compile time\n\nRun-time (Method Overriding):\n  Child class provides specific implementation of parent method\n  Resolved at runtime via virtual dispatch\n\nExample: Animal class has speak()\n  Dog.speak() → "Woof"\n  Cat.speak() → "Meow"\n  Same call, different result based on actual object type'}
        ]
      },
      {
        id:'os', name:'Operating Systems', icon:'⚙️',
        desc:'Processes · Threads · Memory · Scheduling · File Systems · Deadlock',
        notes:[
          {title:'Process vs Thread',body:'Process:\n  Independent program in execution\n  Own memory space (code, data, heap, stack)\n  Isolated — crash doesn\'t affect others\n  IPC needed to communicate\n  Creation: expensive (fork())\n\nThread:\n  Lightweight unit within a process\n  Shares process memory (code, data, heap)\n  Own stack and registers\n  Fast creation and context switch\n  Risk: race conditions on shared data\n\n📌 Multi-process: isolation · Multi-thread: performance'},
          {title:'CPU Scheduling Algorithms',body:'FCFS (First Come First Serve):\n  Simple, non-preemptive, convoy effect\n\nSJF (Shortest Job First):\n  Minimum avg waiting time, may starve long jobs\n\nRound Robin:\n  Time quantum, preemptive, fair\n  Good for time-sharing systems\n\nPriority Scheduling:\n  Higher priority runs first, starvation possible\n  Fix with aging (increase priority over time)\n\nMLFQ (Multi-Level Feedback Queue):\n  Multiple queues with different priorities\n  Most practical, used in real OS'},
          {title:'Deadlock',body:'4 Conditions (ALL must hold):\n  1. Mutual Exclusion: resource held exclusively\n  2. Hold and Wait: holding resource while waiting for another\n  3. No Preemption: resources cannot be forcibly taken\n  4. Circular Wait: cycle of waiting processes\n\nPrevention: Eliminate one condition\nAvoidance: Banker\'s Algorithm\nDetection: Resource Allocation Graph\nRecovery: Terminate process or preempt resource\n\n📌 Deadlock vs Starvation:\n  Deadlock = no progress for all · Starvation = no progress for one'}
        ],
        videos:[
          {title:'Operating Systems Full Course',channel:'Jenny\'s Lectures',duration:'Playlist',url:'https://www.youtube.com/watch?v=vBURTt97EkA',tag:'Full Course'},

// ══════════════════════════════════════════════
//  HOME — build all categories & chips
// ══════════════════════════════════════════════
function buildHome(){
  var html='';
  CATEGORIES.forEach(function(cat){
    html+='<div class="cat-block" data-cat="'+esc(cat.label)+'">';
    html+='<div class="cat-label" style="color:'+cat.color+'">'+esc(cat.label)+'</div>';
    html+='<div class="chips">';
    cat.subjects.forEach(function(s){
      html+='<div class="chip" onclick="openSubject(\''+s.id+'\')" data-name="'+esc(s.name.toLowerCase())+'">'+esc(s.icon)+' '+esc(s.name)+'</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('cat-list').innerHTML=html;
}

function filterSubjects(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.cat-block').forEach(function(cb){
    var chips=cb.querySelectorAll('.chip');
    var any=false;
    chips.forEach(function(c){
      var match=!q||c.getAttribute('data-name').indexOf(q)>-1;
      c.style.display=match?'':'none';
      if(match)any=true;
    });
    cb.style.display=any?'':'none';
  });
}

// ══════════════════════════════════════════════
//  SUBJECT VIEW
// ══════════════════════════════════════════════
function findSubject(id){
  for(var ci=0;ci<CATEGORIES.length;ci++){
    for(var si=0;si<CATEGORIES[ci].subjects.length;si++){
      if(CATEGORIES[ci].subjects[si].id===id)
        return{subj:CATEGORIES[ci].subjects[si],cat:CATEGORIES[ci]};
    }
  }
  return null;
}

function openSubject(id){
  var found=findSubject(id);
  if(!found)return;
  currentSubject=found.subj;
  var cat=found.cat;
  document.getElementById('home-view').style.display='none';
  document.getElementById('subj-view').style.display='block';
  document.getElementById('subj-name-bar').textContent=found.subj.icon+' '+found.subj.name;
  document.getElementById('subj-content').innerHTML=buildSubjHTML(found.subj,cat,'notes');
  window.scrollTo(0,0);
}

function closeSubject(){
  document.getElementById('subj-view').style.display='none';
  document.getElementById('home-view').style.display='block';
  currentSubject=null;
}

function buildSubjHTML(s, cat, activeTab){
  var color=cat.color;
  var lightColor=hexToRgba(color,0.08);
  var borderColor=hexToRgba(color,0.25);

  var tabsHTML=['notes','videos','iq','mynotes'].map(function(t){
    var labels={notes:'📝 Notes',videos:'▶️ Videos',iq:'❓ Q&A',mynotes:'✏️ My Notes'};
    return '<button class="itab'+(t===activeTab?' on':'')+'" onclick="switchPane(\''+t+'\')">' + labels[t] + '</button>';
  }).join('');

  return '<div class="subj-hdr" style="background:'+lightColor+';border:1px solid '+borderColor+'">' +
    '<div class="subj-ico">'+s.icon+'</div>' +
    '<div><div class="subj-title">'+esc(s.name)+'</div><div class="subj-cat">'+esc(s.desc)+'</div></div>' +
    '</div>' +
    '<div class="itabs">'+tabsHTML+'</div>' +
    '<div id="ipane-notes" class="ipane'+(activeTab==='notes'?' on':'')+'">' + buildNotes(s.notes||[]) + '</div>' +
    '<div id="ipane-videos" class="ipane'+(activeTab==='videos'?' on':'')+'">' + buildVideos(s.videos||[]) + '</div>' +
    '<div id="ipane-iq" class="ipane'+(activeTab==='iq'?' on':'')+'">' + buildIQ(s.iqs||[]) + '</div>' +
    '<div id="ipane-mynotes" class="ipane'+(activeTab==='mynotes'?' on':'')+'">' + buildMyNotes(s.id) + '</div>';
}

function switchPane(pane){
  var order=['notes','videos','iq','mynotes'];
  document.querySelectorAll('.itab').forEach(function(b,i){ b.classList.toggle('on',order[i]===pane); });
  document.querySelectorAll('.ipane').forEach(function(p){ p.classList.remove('on'); });
  var el=document.getElementById('ipane-'+pane);
  if(el)el.classList.add('on');
}

// Colour helper
function hexToRgba(hex,alpha){
  var r=0,g=0,b=0;
  if(hex.length===4){r=parseInt(hex[1]+hex[1],16);g=parseInt(hex[2]+hex[2],16);b=parseInt(hex[3]+hex[3],16);}
  else if(hex.length===7){r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16);}
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

// ══════════════════════════════════════════════
//  NOTES
// ══════════════════════════════════════════════
function buildNotes(notes){
  if(!notes.length) return '<div class="empty"><span>📝</span>Notes coming soon!</div>';
  return notes.map(function(n){
    return '<div class="note-chip"><div class="note-chip-t">📌 '+esc(n.title)+'</div><div class="note-chip-b">'+esc(n.body)+'</div></div>';
  }).join('');
}

// ══════════════════════════════════════════════
//  VIDEOS — direct YouTube (NO iframe = NO Error 153)
// ══════════════════════════════════════════════
function buildVideos(videos){
  if(!videos.length) return '<div class="empty"><span>▶️</span>Videos coming soon!</div>';
  var hint='<div class="vid-hint">▶️ <strong>Tap any card</strong> — opens YouTube in new tab. No login needed.</div>';
  return hint+videos.map(function(v){
    var safe=v.url.replace(/"/g,'%22');
    return '<div class="vid-card" data-url="'+safe+'" onclick="openVid(this)">'+
      '<div class="vid-thumb">▶️</div>'+
      '<div class="vid-info">'+
        '<div class="vid-title">'+esc(v.title)+'</div>'+
        '<div class="vid-meta">'+esc(v.channel)+' · '+esc(v.duration)+'</div>'+
      '</div>'+
      '<span class="vid-badge">'+esc(v.tag)+'</span>'+
      '<span class="vid-arrow">↗</span>'+
      '</div>';
  }).join('');
}

function openVid(el){
  var t=el.hasAttribute('data-url')?el:el.closest('[data-url]');
  if(t){var u=t.getAttribute('data-url');if(u)window.open(u,'_blank','noopener,noreferrer');}
}

// ══════════════════════════════════════════════
//  Q&A
// ══════════════════════════════════════════════
function buildIQ(iqs){
  if(!iqs.length) return '<div class="empty"><span>❓</span>Q&A coming soon!</div>';
  return '<p style="font-size:.74rem;color:var(--muted);margin-bottom:10px;">Tap "Show Answer" — great for viva & exam prep.</p>'+
    iqs.map(function(q,i){
      var id='iq-'+Date.now()+'-'+i;
      return '<div class="iq-item">'+
        '<div class="iq-q"><span class="iq-num">Q'+(i+1)+'</span>'+esc(q.q)+'</div>'+
        '<button class="iq-btn" onclick="toggleIQ(\''+id+'\',this)">Show Answer ▼</button>'+
        '<div class="iq-ans" id="'+id+'">'+esc(q.a)+'</div>'+
        '</div>';
    }).join('');
}

function toggleIQ(id,btn){
  var el=document.getElementById(id);
  var open=el.style.display==='block';
  el.style.display=open?'none':'block';
  btn.textContent=open?'Show Answer ▼':'Hide Answer ▲';
  btn.style.background=open?'':'var(--accent)';
  btn.style.color=open?'':'#fff';
  btn.style.borderColor=open?'':'var(--accent)';
}

// ══════════════════════════════════════════════
//  MY NOTES
// ══════════════════════════════════════════════
function getMyNotes(id){try{return JSON.parse(localStorage.getItem('ep_notes_'+id)||'[]');}catch(e){return[];}}
function saveMyNotes(id,n){try{localStorage.setItem('ep_notes_'+id,JSON.stringify(n));}catch(e){}}

function buildMyNotes(id){
  var notes=getMyNotes(id);
  var saved=notes.length?
    '<div style="margin-top:14px;"><div style="font-size:.78rem;font-weight:700;margin-bottom:7px;">Saved Notes ('+notes.length+')</div>'+
    notes.map(function(n,i){
      return '<div class="saved-note">'+
        '<div class="sn-hdr"><span class="sn-title">'+esc(n.title)+'</span>'+
        '<div style="display:flex;gap:5px;align-items:center;"><span class="sn-date">'+esc(n.date)+'</span>'+
        '<button class="del-btn" onclick="delNote(\''+id+'\','+i+')">🗑</button></div></div>'+
        '<div class="sn-body">'+esc(n.body)+'</div></div>';
    }).join('')+'</div>':
    '<div class="empty"><span>📓</span>No saved notes yet.<br>Write your first note below!</div>';

  return '<div class="notes-ed">'+
    '<p style="font-size:.76rem;color:var(--muted);margin-bottom:7px;">Personal notes for this subject:</p>'+
    '<input class="note-title-inp" id="nt-'+id+'" type="text" placeholder="Note title (optional)…"/>'+
    '<textarea id="nb-'+id+'" placeholder="Write key points, formulas, exam tips…"></textarea>'+
    '<button class="btn-save" onclick="addNote(\''+id+'\')">💾 Save Note</button>'+
    '</div>'+saved;
}

function addNote(id){
  var ti=document.getElementById('nt-'+id);
  var bi=document.getElementById('nb-'+id);
  var body=(bi?bi.value:'').trim();
  if(!body){showToast('Please write something first!');return;}
  var title=(ti?ti.value:'').trim()||new Date().toLocaleDateString();
  var notes=getMyNotes(id);
  notes.unshift({title:title,body:body,date:new Date().toLocaleString()});
  saveMyNotes(id,notes);
  if(ti)ti.value='';if(bi)bi.value='';
  showToast('✅ Note saved!');
  var el=document.getElementById('ipane-mynotes');
  if(el)el.innerHTML=buildMyNotes(id);
}

function delNote(id,idx){
  var notes=getMyNotes(id);
  notes.splice(idx,1);
  saveMyNotes(id,notes);
  showToast('🗑 Deleted');
  var el=document.getElementById('ipane-mynotes');
  if(el)el.innerHTML=buildMyNotes(id);
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
var toastT=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  if(toastT)clearTimeout(toastT);
  toastT=setTimeout(function(){t.classList.remove('show');},2200);
}

// ══════════════════════════════════════════════
//  ESCAPE
// ══════════════════════════════════════════════
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════
//  AI CHATBOT
// ══════════════════════════════════════════════
function openChat(){if(!chatOpen)toggleChat();}
function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chat-win').classList.toggle('open',chatOpen);
  if(chatOpen&&!chatInited){chatInited=true;cwGreet();}
  if(chatOpen){setTimeout(function(){var m=document.getElementById('cw-msgs');m.scrollTop=m.scrollHeight;},80);setTimeout(function(){document.getElementById('cw-inp').focus();},100);}
}

function cwGreet(){
  var subj=currentSubject?currentSubject.name:'any subject';
  cwBot('Hey! 👋 I\'m your **EduPocket AI** Study Assistant!\n\n'+(currentSubject?'Currently viewing: **'+subj+'**\n\n':'')+'Ask me about:\n• Any subject — concepts, tips, mnemonics\n• **FPI score** explanation\n• Study plan & memory tricks\n• Interview/viva prep');
  cwChips(['What is FPI?','Study tips','Memory tricks','Interview prep']);
}

function cwSend(){
  var inp=document.getElementById('cw-inp');
  var msg=(inp.value||'').trim();
  if(!msg)return;
  inp.value='';
  cwUsr(msg);cwDots();
  setTimeout(function(){cwUndots();cwBot(cwReply(msg));cwChips(['FPI tips','Study plan','Memory tricks','More help']);},600);
}

function cwUsr(txt){
  var m=document.getElementById('cw-msgs');
  var d=document.createElement('div');d.className='cm usr';
  var t=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML='<div class="cb">'+esc(txt)+'</div><div class="ct">'+t+'</div>';
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}

function cwBot(txt){
  var m=document.getElementById('cw-msgs');
  var d=document.createElement('div');d.className='cm bot';
  var t=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  var h=txt.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  d.innerHTML='<div class="cb">'+h+'</div><div class="ct">'+t+'</div>';
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}

function cwDots(){
  var m=document.getElementById('cw-msgs');
  dotsEl=document.createElement('div');dotsEl.className='cm bot';dotsEl.id='_dots';
  dotsEl.innerHTML='<div class="cb"><div class="cdots"><span></span><span></span><span></span></div></div>';
  m.appendChild(dotsEl);m.scrollTop=m.scrollHeight;
}
function cwUndots(){if(dotsEl){dotsEl.remove();dotsEl=null;}}

function cwChips(list){
  document.getElementById('cw-qr').innerHTML=list.map(function(c){
    return '<button class="cqb" onclick="(function(){document.getElementById(\'cw-inp\').value='+JSON.stringify(c)+';cwSend();})()">'+esc(c)+'</button>';
  }).join('');
}

function cwReply(msg){
  var m=msg.toLowerCase();
  var fpi=null;
  try{var ctx=JSON.parse(localStorage.getItem('ep_classroom_context')||'{}');fpi=ctx.profile&&ctx.profile.fpi!=null?ctx.profile.fpi:null;}catch(e){}

  if(/^(hi|hello|hey)\b/.test(m))return 'Hey! 👋 Ask me about any subject, FPI, or study strategies!';
  if(/fpi|forgetful|my score/.test(m)){
    if(fpi!==null){var lv=fpi<30?'LOW ✅ excellent!':fpi<60?'MODERATE ⚠️ needs practice.':'HIGH 🚨 daily review required.';return '**Your FPI is '+fpi+'/100** — '+lv+'\n\n0–29 🟢 · 30–59 🟡 · 60–100 🔴';}
    return '**FPI = Forgetfulness Pattern Index** (0–100)\n\nComplete the quiz on the main screen to get your personalised score!';
  }
  if(/dsa|data struct|algorithm|sorting|graph|tree/.test(m))return '**DSA Tips:**\n\n🌲 Trees: know BFS vs DFS (Queue vs Stack)\n⚡ DP: find overlapping subproblems + optimal substructure\n📊 Sorting: Merge O(n log n) stable · Quick O(n log n) in-place\n🔍 Binary Search: O(log n) on sorted data\n\nOpen **DSA** subject for full notes & videos!';
  if(/cloud|aws|iaas|paas|saas/.test(m))return '**Cloud Tips:**\n\n☁️ "I Provide Software" = IaaS/PaaS/SaaS\n📐 Vertical = bigger machine · Horizontal = more machines\n🔐 IAM = Who · VPC = Network · KMS = Keys\n\nOpen **Cloud Computing** for full course!';
  if(/\bml\b|machine.*learn|neural|deep.*learn|overfit/.test(m))return '**ML Tips:**\n\n⚖️ Bias=underfitting · Variance=overfitting\n📊 F1 for imbalanced · AUC for ranking\n🌳 Random Forest = parallel bagging\n⚡ XGBoost = sequential boosting\n\nOpen **Machine Learning** for full notes!';
  if(/security|cia|encrypt|hack|cyber/.test(m))return '**Security Tips:**\n\n🔐 CIA: Confidentiality · Integrity · Availability\n🔑 Symmetric (AES) = fast · Asymmetric (RSA) = key exchange\n⚠️ SQLi → parameterised queries\nXSS → output encoding · CSRF → tokens\n\nOpen **Cybersecurity** for full course!';
  if(/react|node|web.*dev|javascript|html|css/.test(m))return '**Web Dev Tips:**\n\n⚛️ React hooks: useState, useEffect, useContext\n🟢 Node.js: non-blocking I/O, event-driven\n🔗 REST: GET/POST/PUT/DELETE conventions\n📦 JWT: stateless auth — header.payload.signature\n\nOpen the Web Dev subjects for full courses!';
  if(/docker|kubernetes|devops|ci.*cd/.test(m))return '**DevOps Tips:**\n\n🐳 Docker: container = isolated process, not a VM\n☸️ K8s: Pod → Deployment → Service → Ingress\n🔄 CI/CD: push → test → build → deploy\n📊 Monitor: logs, metrics, traces (3 pillars observability)\n\nOpen **Docker & Kubernetes** for full course!';
  if(/memory|remember|forget|spaced|trick/.test(m))return '**Memory Techniques:**\n\n🧠 Active Recall: test yourself (don\'t re-read)\n🔁 Spaced Repetition: 10min → 1d → 3d → 1wk → 2wk\n🍋 Feynman: explain it simply out loud\n🗺️ Mind Maps: connect ideas visually\n😴 Sleep: consolidates memory!\n\nYour EduPocket FPI drives your spaced schedule!';
  if(/interview|viva|exam|prepare|tip/.test(m))return '**Interview/Viva Tips:**\n\n1. **Concept → Intuition → Example** — always this order\n2. **Feynman Technique** — explain to a 10-year-old\n3. For every topic: What? Why? Example? Limitation?\n4. **Active recall** beats re-reading 3×\n5. **Speak aloud** while studying — cements memory faster';
  if(/study.*plan|how.*study/.test(m)){
    if(fpi!==null){
      if(fpi>60)return '**FPI '+fpi+' (High):** Review TODAY!\n1. Active recall every day\n2. 25-min Pomodoro blocks\n3. Follow your trigger schedule';
      if(fpi>30)return '**FPI '+fpi+' (Moderate):**\n1. Review every 2–3 days\n2. Practice problems over re-reading\n3. Use classroom videos for weak topics';
      return '**FPI '+fpi+' (Low) — excellent!**\n1. Teach topics to peers (90% retention)\n2. Attempt harder problems\n3. Connect concepts across subjects';
    }
    return 'Complete the main quiz to get a **personalised** study plan based on your FPI score!';
  }
  if(currentSubject)return 'Ask me specific questions about **'+currentSubject.name+'**, or try:\n• "Tips for '+currentSubject.name+'"\n• "How to remember '+currentSubject.name+'"\n• "Interview questions for '+currentSubject.name+'"';
  return 'I can help with **any subject** in the classroom! 📚\n\nTry:\n• **"DSA tips"** · **"ML study plan"**\n• **"Memory tricks"** · **"Interview prep"**\n• **"What is FPI?"**\n\nOr open any subject and ask me about it!';
}
